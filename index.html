<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baldwin MLS — Perchwell Launch Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f7f6f3;--surface:#fff;--border:#e2e0da;--border-strong:#c9c7c0;
  --text:#1a1a18;--text-muted:#6b6960;--text-faint:#9e9c94;
  --accent:#1a4f8a;--accent-bg:#eef3fa;
  --success:#1a7a4a;--success-bg:#edf7f2;
  --warning:#8a5a00;--warning-bg:#fef8ec;
  --danger:#8a1f1f;--danger-bg:#fdf0f0;
  --neutral-bg:#f2f0eb;
  --radius:8px;--radius-lg:12px;
  --font:'DM Sans',system-ui,sans-serif;
  --mono:'DM Mono',monospace;
}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;min-height:100vh}
.shell{display:flex;min-height:100vh}
.sidebar{width:220px;flex-shrink:0;background:var(--text);color:#e8e6df;padding:1.5rem 0;position:fixed;top:0;left:0;bottom:0;display:flex;flex-direction:column;z-index:10}
.sidebar-brand{padding:0 1.25rem 1.5rem;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:.75rem}
.sidebar-brand .org{font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.4);margin-bottom:4px}
.sidebar-brand .product{font-size:15px;font-weight:500;color:#fff}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 1.25rem;font-size:14px;color:rgba(255,255,255,.55);cursor:pointer;border:none;background:none;width:100%;text-align:left;transition:all .1s}
.nav-item:hover{color:#fff;background:rgba(255,255,255,.06)}
.nav-item.active{color:#fff;background:rgba(255,255,255,.1)}
.nav-icon{width:16px;height:16px;flex-shrink:0;opacity:.7}
.nav-item.active .nav-icon{opacity:1}
.sidebar-bottom{margin-top:auto;padding:1rem 1.25rem;border-top:1px solid rgba(255,255,255,.08)}
.api-status{font-size:11px;color:rgba(255,255,255,.35);display:flex;align-items:center;gap:6px}
.status-dot{width:6px;height:6px;border-radius:50%;background:#666;flex-shrink:0}
.status-dot.connected{background:#4caf82}
.status-dot.local{background:#f0a43a}
.main{margin-left:220px;padding:2rem;flex:1;max-width:1150px}
.page-header{margin-bottom:1.5rem;display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:1rem}
.page-title{font-size:22px;font-weight:500}
.page-sub{font-size:14px;color:var(--text-muted);margin-top:2px}
.stat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:1.25rem}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1rem 1.25rem}
.stat-label{font-size:12px;color:var(--text-muted);font-weight:500;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.stat-value{font-size:28px;font-weight:500;line-height:1}
.stat-value.warn{color:var(--warning)}
.stat-value.danger{color:var(--danger)}
.stat-value.success{color:var(--success)}
/* Controls bar — persistent, never re-rendered */
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1rem;align-items:center}
.search-wrap{position:relative;min-width:200px;max-width:280px;flex:1}
.search-wrap input{width:100%;padding-left:32px}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-faint);pointer-events:none}
input[type=text],input[type=date],select,textarea{font-family:var(--font);font-size:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px;color:var(--text);outline:none;transition:border-color .15s;width:100%}
input[type=text]:focus,input[type=date]:focus,select:focus,textarea:focus{border-color:var(--accent)}
select{cursor:pointer}
.count-label{font-size:13px;color:var(--text-muted);white-space:nowrap}
/* Table */
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
table{width:100%;border-collapse:collapse;table-layout:fixed}
thead th{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);padding:10px 14px;background:var(--bg);border-bottom:1px solid var(--border);text-align:left;white-space:nowrap;cursor:pointer;user-select:none}
thead th:hover{color:var(--text)}
thead th.sorted-asc::after{content:" ↑";color:var(--accent)}
thead th.sorted-desc::after{content:" ↓";color:var(--accent)}
thead th.no-sort{cursor:default}
thead th.no-sort:hover{color:var(--text-muted)}
tbody tr{border-bottom:1px solid var(--border);transition:background .1s;cursor:pointer}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:#fafaf8}
td{padding:11px 14px;font-size:14px;vertical-align:middle;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.col-av{width:48px}
.col-name{width:auto}
.col-office{width:200px}
.col-role{width:140px}
.col-cohort{width:80px}
.col-status{width:170px}
.col-act{width:70px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent-bg);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;flex-shrink:0}
.name-cell .name{font-weight:500;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-flex;align-items:center;font-size:11px;font-weight:500;padding:2px 8px;border-radius:99px;white-space:nowrap}
.badge-issue{background:var(--warning-bg);color:var(--warning);margin-left:6px}
.badge-note{background:var(--neutral-bg);color:var(--text-muted);margin-left:6px}
.inline-status{font-size:12px;padding:4px 6px;border:1px solid var(--border)}
.btn{font-family:var(--font);font-size:13px;font-weight:500;border-radius:var(--radius);padding:7px 14px;cursor:pointer;transition:all .1s;border:1px solid var(--border);background:var(--surface);color:var(--text)}
.btn:hover{background:var(--bg)}
.btn-primary{background:var(--text);color:var(--surface);border-color:var(--text)}
.btn-primary:hover{background:#333}
.btn-sm{font-size:12px;padding:5px 10px}
.pagination{display:flex;align-items:center;gap:8px;justify-content:flex-end;padding:.75rem 0;font-size:13px;color:var(--text-muted)}
/* Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-start;justify-content:center;padding:3rem 1rem;z-index:100;overflow-y:auto}
.modal{background:var(--surface);border-radius:var(--radius-lg);border:1px solid var(--border);width:100%;max-width:580px;padding:1.5rem;position:relative}
.modal-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:1.25rem}
.modal-avatar{width:48px;height:48px;border-radius:50%;background:var(--accent-bg);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:500;flex-shrink:0}
.modal-name{font-size:17px;font-weight:500}
.modal-sub{font-size:13px;color:var(--text-muted);margin-top:2px}
.close-x{margin-left:auto;background:none;border:none;font-size:22px;cursor:pointer;color:var(--text-faint);padding:0;line-height:1}
.close-x:hover{color:var(--text)}
.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:1.25rem}
.tab{font-family:var(--font);font-size:13px;padding:8px 16px;border:none;border-bottom:2px solid transparent;background:none;color:var(--text-muted);cursor:pointer;font-weight:500}
.tab.active{color:var(--text);border-bottom-color:var(--text)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;font-weight:500;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em}
.section-label{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin:14px 0 6px}
.log-entry{border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;margin-bottom:8px}
.log-meta{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.log-date{font-size:12px;color:var(--text-muted)}
.log-text{font-size:13px;line-height:1.5}
.log-form{background:var(--bg);border-radius:var(--radius);padding:14px}
.log-form-row{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.log-form-row select,.log-form-row input{flex:1;min-width:100px}
.log-form textarea{min-height:80px;resize:vertical;margin-bottom:10px}
/* Add member form */
.add-form{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.5rem;max-width:600px}
.add-form h2{font-size:16px;font-weight:500;margin-bottom:1.25rem}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.form-full{grid-column:1/-1}
/* Dashboard */
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.dash-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.25rem}
.dash-card-title{font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin-bottom:1rem}
.bar-row{margin-bottom:10px}
.bar-label-row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.bar-track{height:6px;background:var(--bg);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px}
.attention-row{padding:8px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-size:13px}
.attention-row:last-child{border-bottom:none}
.attention-row:hover{color:var(--accent)}
.recent-row{padding:8px 0;border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:flex-start;cursor:pointer;font-size:13px}
.recent-row:last-child{border-bottom:none}
.recent-row:hover{color:var(--accent)}
.recent-row .who{font-weight:500}
.recent-row .what{color:var(--text-muted)}
.recent-date{font-size:12px;color:var(--text-faint);flex-shrink:0;margin-left:auto}
.dash-full{grid-column:1/-1}
.settings-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.25rem;margin-bottom:1rem;max-width:600px}
.settings-card-title{font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin-bottom:.75rem}
.empty-state{text-align:center;padding:3rem;color:var(--text-muted);font-size:14px}
.toast{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--text);color:var(--surface);padding:10px 18px;border-radius:var(--radius);font-size:14px;z-index:1000;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>

<div class="shell">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="org">Baldwin MLS</div>
      <div class="product">Perchwell Tracker</div>
    </div>
    <button class="nav-item active" onclick="showView('members')" id="nav-members">

        <div class="status-dot" id="status-dot"></div>
        <span id="status-label">Offline / local</span>
      </div>
    </div>
  </aside>

  <main class="main">
    <!-- Static page shell — only inner sections update -->
    <div id="view-members" style="display:none">
      <div class="page-header">
        <div>
          <div class="page-title">Member directory</div>
          <div class="page-sub" id="member-sub">Baldwin MLS · Perchwell launch tracking</div>
        </div>
        <button class="btn btn-primary" onclick="showView('add')">+ Add member</button>
      </div>
      <div class="stat-grid" id="stat-grid"></div>
      <!-- Controls: rendered ONCE, never rebuilt -->
      <div class="controls">
        <div class="search-wrap">
          <svg class="search-icon" width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.099zm-5.242 1.156a5.5 5.5 0 1 1 0-11 5.5 5.5 0 0 1 0 11z"/></svg>
          <input type="text" id="search" placeholder="Search name, office, email…" oninput="onFilter()">
        </div>
        <select id="filter-role" onchange="onFilter()" style="width:auto">
          <option value="">All roles</option>
          <option>MLS BOD</option><option>Association BOD</option><option>PAB</option><option>MLS Staff</option><option>Member</option>
        </select>
        <select id="filter-cohort" onchange="onFilter()" style="width:auto">
          <option value="">All cohorts</option>
          <option value="0">BOD / Staff / Key</option>
          <option value="1">Cohort 1</option>
          <option value="2">Cohort 2</option>
          <option value="3">Cohort 3</option>
        </select>
        <select id="filter-status" onchange="onFilter()" style="width:auto">
          <option value="">All statuses</option>
          <option>Not contacted</option><option>In outreach</option><option>Training scheduled</option><option>Training complete</option><option>Live</option><option>Needs follow-up</option>
        </select>
        <select id="filter-flag" onchange="onFilter()" style="width:auto">
          <option value="">All members</option>
          <option value="issue">Has open issue</option>
          <option value="notes">Has notes</option>
        </select>
        <span class="count-label" id="count-label"></span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th class="col-av no-sort"></th>
              <th class="col-name" onclick="setSort('name')">Name</th>
              <th class="col-office" onclick="setSort('office')">Office</th>
              <th class="col-role" onclick="setSort('role')">Role</th>
              <th class="col-cohort" onclick="setSort('cohort')">Cohort</th>
              <th class="col-status no-sort">Status</th>
              <th class="col-act no-sort"></th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div class="pagination">
        <span id="page-info" style="font-size:13px;color:var(--text-muted)"></span>
        <button class="btn btn-sm" id="prev-btn" onclick="changePage(-1)">← Prev</button>
        <button class="btn btn-sm" id="next-btn" onclick="changePage(1)">Next →</button>
      </div>
    </div>

    <div id="view-add" style="display:none"></div>
    <div id="view-dashboard" style="display:none"></div>
    <div id="view-settings" style="display:none"></div>
  </main>
</div>

const STATUSES = ["Not contacted","In outreach","Training scheduled","Training complete","Live","Needs follow-up"];
const STATUS_COLORS = {"Not contacted":"#9e9c94","In outreach":"#1a4f8a","Training scheduled":"#8a5a00","Training complete":"#1a7a4a","Live":"#1a7a4a","Needs follow-up":"#8a1f1f"};
const STATUS_BG = {"Not contacted":"var(--neutral-bg)","In outreach":"var(--accent-bg)","Training scheduled":"var(--warning-bg)","Training complete":"var(--success-bg)","Live":"var(--success-bg)","Needs follow-up":"var(--danger-bg)"};
const PAGE_SIZE = 25;
let APPS_SCRIPT_URL = localStorage.getItem('crm_api_url') || '';

// ── Persistent filter/sort state (survives re-renders) ──
let filterState = {q:'', role:'', cohort:'', status:'', flag:''};
let sortState = {col:'name', dir:'asc'};
let currentPage = 0;
let activeView = 'members';

// ── State ──
function loadState(){
  try{const s=localStorage.getItem('bald_crm_v3');if(s)return JSON.parse(s);}catch(e){}
  return null;
}
function saveState(){
  try{localStorage.setItem('bald_crm_v3',JSON.stringify(state));}catch(e){}
}
let state = loadState();
if(!state){
  state={members:SEED.map((m,i)=>({id:i,...m,interactions:m.interactions||[]}))};
  saveState();
}

// ── Helpers ──
function initials(name){
  const p=(name||'?').split(' ');
  return p.length>=2?(p[0][0]+p[p.length-1][0]).toUpperCase():(name||'?').slice(0,2).toUpperCase();
}
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}
function isConnected(){return!!APPS_SCRIPT_URL;}
function updateConnectionStatus(){
  const dot=document.getElementById('status-dot');
  const lbl=document.getElementById('status-label');
  if(isConnected()){dot.className='status-dot connected';lbl.textContent='Google Sheets synced';}
  else{dot.className='status-dot local';lbl.textContent='Local only';}
}
async function apiCall(params){
  if(!APPS_SCRIPT_URL)return null;
  try{
    const url=APPS_SCRIPT_URL+'?'+new URLSearchParams(params).toString();
    const res=await fetch(url);
    return await res.json();
  }catch(e){return null;}
}

// ── Filter + Sort ──
function getFiltered(){
  const{q,role,cohort,status,flag}=filterState;
  const ql=q.toLowerCase();
  let rows=state.members.filter(m=>{
    if(q&&!m.name.toLowerCase().includes(ql)&&!m.office.toLowerCase().includes(ql)&&!m.email.toLowerCase().includes(ql))return false;
    if(role&&!m.role.includes(role))return false;
    if(cohort!==''&&String(m.cohort||0)!==cohort)return false;
    if(status&&m.status!==status)return false;
    if(flag==='issue'&&!m.issues)return false;
    if(flag==='notes'&&!m.notes&&(!m.interactions||m.interactions.length===0))return false;
    return true;
  });
  // Sort
  const{col,dir}=sortState;
  rows.sort((a,b)=>{
    let av=String(a[col]||'').toLowerCase();
    let bv=String(b[col]||'').toLowerCase();
    if(col==='cohort'){av=Number(a.cohort||0);bv=Number(b.cohort||0);return dir==='asc'?av-bv:bv-av;}
    return dir==='asc'?av.localeCompare(bv):bv.localeCompare(av);
  });
  return rows;
}
function onFilter(){
  filterState.q=(document.getElementById('search')||{value:''}).value;
  filterState.role=(document.getElementById('filter-role')||{value:''}).value;
  filterState.cohort=(document.getElementById('filter-cohort')||{value:''}).value;
  filterState.status=(document.getElementById('filter-status')||{value:''}).value;
  filterState.flag=(document.getElementById('filter-flag')||{value:''}).value;
  currentPage=0;
  renderTable();
}
function setSort(col){
  if(sortState.col===col){sortState.dir=sortState.dir==='asc'?'desc':'asc';}
  else{sortState.col=col;sortState.dir='asc';}
  // Update header classes
  document.querySelectorAll('thead th').forEach(th=>{
    th.classList.remove('sorted-asc','sorted-desc');
    if(th.getAttribute('onclick')===`setSort('${col}')`){
      th.classList.add(sortState.dir==='asc'?'sorted-asc':'sorted-desc');
    }
  });
  renderTable();
}

// ── Views ──
function showView(v){
  activeView=v;
  ['members','add','dashboard','settings'].forEach(id=>{
    document.getElementById('view-'+id).style.display=id===v?'block':'none';
    const nav=document.getElementById('nav-'+id);
    if(nav)nav.classList.toggle('active',id===v);
  });
  if(v==='members'){renderStats();renderTable();updateConnectionStatus();}
  else if(v==='add'){renderAddForm();}
  else if(v==='dashboard'){renderDashboard();}
  else if(v==='settings'){renderSettings();}
}

// ── Stats (separate from table so filters don't affect them) ──
function renderStats(){
  const total=state.members.length;
  const trained=state.members.filter(m=>['Training complete','Live'].includes(m.status)).length;
  const hasIssues=state.members.filter(m=>m.issues).length;
  const followUp=state.members.filter(m=>m.status==='Needs follow-up').length;
  document.getElementById('stat-grid').innerHTML=`
    <div class="stat-card"><div class="stat-label">Total members</div><div class="stat-value">${total}</div></div>
    <div class="stat-card"><div class="stat-label">Trained or live</div><div class="stat-value success">${trained}</div></div>
    <div class="stat-card"><div class="stat-label">Open issues</div><div class="stat-value warn">${hasIssues}</div></div>
    <div class="stat-card"><div class="stat-label">Need follow-up</div><div class="stat-value danger">${followUp}</div></div>
  `;
  document.getElementById('member-sub').textContent=`Baldwin MLS · Perchwell launch tracking · ${total} members`;
}

// ── Table (only tbody updates) ──
function renderTable(){
  const rows=getFiltered();
  const total=rows.length;
  const start=currentPage*PAGE_SIZE;
  const page=rows.slice(start,start+PAGE_SIZE);

  document.getElementById('count-label').textContent=
    total===0?'No results':`Showing ${Math.min(start+1,total)}–${Math.min(start+PAGE_SIZE,total)} of ${total}`;
  document.getElementById('page-info').textContent=
    `Page ${currentPage+1} of ${Math.max(1,Math.ceil(total/PAGE_SIZE))}`;
  document.getElementById('prev-btn').disabled=currentPage===0;
  document.getElementById('next-btn').disabled=start+PAGE_SIZE>=total;

  // Sync filter inputs with filterState (so they persist)
  const el=id=>document.getElementById(id);
  if(el('search'))el('search').value=filterState.q;
  if(el('filter-role'))el('filter-role').value=filterState.role;
  if(el('filter-cohort'))el('filter-cohort').value=filterState.cohort;
  if(el('filter-status'))el('filter-status').value=filterState.status;
  if(el('filter-flag'))el('filter-flag').value=filterState.flag;

  const tbody=document.getElementById('tbody');
  if(!tbody)return;
  if(page.length===0){
    tbody.innerHTML=`<tr><td colspan="7"><div class="empty-state">No members match your filters.</div></td></tr>`;
    return;
  }
  tbody.innerHTML=page.map(m=>`
    <tr onclick="openMember(${m.id})">
      <td class="col-av"><div class="avatar">${initials(m.name)}</div></td>
      <td class="col-name">
        <div class="name">${m.name}${m.issues?'<span class="badge badge-issue">issue</span>':''}</div>
      </td>
      <td class="col-office" style="font-size:13px;color:var(--text-muted)">${m.office||'—'}</td>
      <td class="col-role" style="font-size:13px;color:var(--text-muted)">${m.role||'—'}</td>
      <td class="col-cohort" style="font-size:13px;color:var(--text-muted)">${m.cohort>0?'C'+m.cohort:'Key'}</td>
      <td class="col-status" onclick="event.stopPropagation()">
        <select class="inline-status" onchange="updateStatus(${m.id},this.value)">
          ${STATUSES.map(s=>`<option${m.status===s?' selected':''} value="${s}">${s}</option>`).join('')}
        </select>
      </td>
      <td class="col-act"><button class="btn btn-sm" onclick="event.stopPropagation();openMember(${m.id})">Open</button></td>
    </tr>`).join('');
}

function changePage(d){
  const rows=getFiltered();
  currentPage=Math.max(0,Math.min(Math.ceil(rows.length/PAGE_SIZE)-1,currentPage+d));
  renderTable();
}
function updateStatus(id,val){
  const m=state.members.find(x=>x.id===id);
  if(m){m.status=val;saveState();if(isConnected())apiCall({action:'updateMember',id,status:val});}
}

// ── Member modal ──
function openMember(id){
  const m=state.members.find(x=>x.id===id);
  if(!m)return;
  const overlay=document.createElement('div');
  overlay.className='overlay';overlay.id='modal-overlay';
  overlay.onclick=e=>{if(e.target===overlay)closeModal();};
  overlay.innerHTML=`
    <div class="modal">
      <div class="modal-head">
        <div class="modal-avatar">${initials(m.name)}</div>
        <div>
          <div class="modal-name">${m.name}</div>
          <div class="modal-sub">${m.role||'—'}${m.office?' · '+m.office:''}</div>
        </div>
        <button class="close-x" onclick="closeModal()">×</button>
      </div>
      <div class="tabs">
        <button class="tab active" id="t-overview" onclick="switchTab('overview')">Overview</button>
        <button class="tab" id="t-history" onclick="switchTab('history')">History (${(m.interactions||[]).length})</button>
        <button class="tab" id="t-log" onclick="switchTab('log')">Log interaction</button>
      </div>
      <div id="tab-overview">${overviewTab(m)}</div>
      <div id="tab-history" style="display:none">${historyTab(m)}</div>
      <div id="tab-log" style="display:none">${logTab(m)}</div>
    </div>`;
  document.body.appendChild(overlay);
}
function closeModal(){
  const o=document.getElementById('modal-overlay');
  if(o)o.remove();
  if(activeView==='members'){renderStats();renderTable();}
}
function switchTab(t){
  ['overview','history','log'].forEach(x=>{
    document.getElementById('tab-'+x).style.display=x===t?'block':'none';
    document.getElementById('t-'+x).classList.toggle('active',x===t);
  });
}
function overviewTab(m){
  return `
    <div class="field-row">
      <div class="field"><label>Email</label><div style="font-size:14px">${m.email||'—'}</div></div>
      <div class="field"><label>Phone</label><div style="font-size:14px">${m.phone||'—'}</div></div>
      <div class="field"><label>Office</label><input type="text" id="edit-office" value="${(m.office||'')}"></div>
      <div class="field"><label>Status</label>
        <select class="inline-status" onchange="updateStatusModal(${m.id},this.value)">
          ${STATUSES.map(s=>`<option${m.status===s?' selected':''} value="${s}">${s}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>Training type</label>
        <select class="inline-status" onchange="updateField(${m.id},'trainingType',this.value)">
          <option value=""${!m.trainingType?' selected':''}>Not set</option>
          ${['In-person','Webinar','Self-guided','Office hours','1:1 session'].map(s=>`<option${m.trainingType===s?' selected':''} value="${s}">${s}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>Training date</label>
        <input type="date" value="${m.trainingDate||''}" onchange="updateField(${m.id},'trainingDate',this.value)">
      </div>
    </div>
    <div class="section-label">Notes</div>
    <textarea id="edit-notes" style="width:100%;font-size:13px;min-height:90px;resize:vertical">${m.notes||''}</textarea>
    <div class="section-label">Issues / flags</div>
    <textarea id="edit-issues" style="width:100%;font-size:13px;min-height:70px;resize:vertical">${m.issues||''}</textarea>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="btn btn-primary" onclick="saveEdits(${m.id})">Save changes</button>
    </div>`;
}
function historyTab(m){
  const interactions=m.interactions||[];
  if(!interactions.length)return'<div class="empty-state">No interactions logged yet.</div>';
  return interactions.slice().reverse().map(i=>`
    <div class="log-entry">
      <div class="log-meta">
        <span class="badge" style="background:${i.type==='Issue'?'var(--warning-bg)':i.type==='Feedback'?'var(--success-bg)':i.type==='Training'?'var(--warning-bg)':'var(--accent-bg)'};color:${i.type==='Issue'?'var(--warning)':i.type==='Feedback'?'var(--success)':i.type==='Training'?'var(--warning)':'var(--accent)'}">${i.type}</span>
        <span class="log-date">${i.date} · ${i.loggedBy||'Perchwell'}</span>
      </div>
      <div class="log-text">${i.note}</div>
    </div>`).join('');
}
function logTab(m){
  return `
    <div class="log-form">
      <div class="log-form-row">
        <select id="log-type" style="width:auto">
          <option>Call</option><option>Email</option><option>Training</option><option>Feedback</option><option>Issue</option><option>Note</option>
        </select>
        <input type="date" id="log-date" value="${new Date().toISOString().split('T')[0]}">
        <input type="text" id="log-by" placeholder="Your name" style="flex:1">
      </div>
      <textarea id="log-note" placeholder="Describe the interaction, feedback, or issue…"></textarea>
      <button class="btn btn-primary" onclick="saveLog(${m.id})">Add interaction</button>
    </div>`;
}
function updateStatusModal(id,val){
  const m=state.members.find(x=>x.id===id);
  if(m){m.status=val;saveState();if(isConnected())apiCall({action:'updateMember',id,status:val});}
}
function updateField(id,field,val){
  const m=state.members.find(x=>x.id===id);
  if(m){m[field]=val;saveState();if(isConnected())apiCall({action:'updateMember',id,...{[field]:val}});}
}
function saveEdits(id){
  const m=state.members.find(x=>x.id===id);
  m.notes=document.getElementById('edit-notes').value;
  m.issues=document.getElementById('edit-issues').value;
  m.office=document.getElementById('edit-office').value;
  saveState();
  if(isConnected())apiCall({action:'updateMember',id,notes:m.notes,issues:m.issues});
  toast('Saved');
}
function saveLog(id){
  const m=state.members.find(x=>x.id===id);
  const note=document.getElementById('log-note').value.trim();
  if(!note){toast('Please enter a note');return;}
  const type=document.getElementById('log-type').value;
  const date=document.getElementById('log-date').value;
  const loggedBy=document.getElementById('log-by').value.trim()||'MLS Staff';
  if(!m.interactions)m.interactions=[];
  m.interactions.push({type,date,loggedBy,note});
  if(type==='Issue')m.issues=(m.issues?m.issues+'\n':'')+`[${date}] ${note}`;
  saveState();
  if(isConnected())apiCall({action:'addInteraction',memberId:id,memberName:m.name,type,date,loggedBy,note});
  toast('Interaction logged');
  closeModal();
  openMember(id);
  switchTab('history');
}

// ── Add member ──
function renderAddForm(){
  document.getElementById('view-add').innerHTML=`
    <div class="page-header"><div>
      <div class="page-title">Add member</div>
      <div class="page-sub">Add a new member to the directory</div>
    </div></div>
    <div class="add-form">
      <div class="form-grid">
        <div class="field"><label>First name *</label><input type="text" id="new-fname" placeholder="First name"></div>
        <div class="field"><label>Last name *</label><input type="text" id="new-lname" placeholder="Last name"></div>
        <div class="field"><label>Email</label><input type="text" id="new-email" placeholder="email@example.com"></div>
        <div class="field"><label>Phone</label><input type="text" id="new-phone" placeholder="(251) 555-0100"></div>
        <div class="field form-full"><label>Office / brokerage</label><input type="text" id="new-office" placeholder="Brokerage name"></div>
        <div class="field"><label>Role</label>
          <select id="new-role">
            <option value="Member">Member</option>
            <option value="MLS BOD">MLS BOD</option>
            <option value="Association BOD">Association BOD</option>
            <option value="PAB">PAB</option>
            <option value="MLS Staff">MLS Staff</option>
            <option value="Broker, UAT">Broker, UAT</option>
            <option value="Association President">Association President</option>
          </select>
        </div>
        <div class="field"><label>Cohort</label>
          <select id="new-cohort">
            <option value="0">Key contact / BOD / Staff</option>
            <option value="1">Cohort 1</option>
            <option value="2">Cohort 2</option>
            <option value="3">Cohort 3</option>
          </select>
        </div>
        <div class="field"><label>Status</label>
          <select id="new-status">
            ${STATUSES.map(s=>`<option value="${s}">${s}</option>`).join('')}
          </select>
        </div>
        <div class="field"><label>Training type</label>
          <select id="new-training-type">
            <option value="">Not set</option>
            <option>In-person</option><option>Webinar</option><option>Self-guided</option><option>Office hours</option><option>1:1 session</option>
          </select>
        </div>
        <div class="field"><label>Training date</label><input type="date" id="new-training-date"></div>
        <div class="field form-full"><label>Notes</label><textarea id="new-notes" style="min-height:80px;resize:vertical" placeholder="Background context, meeting notes…"></textarea></div>
        <div class="field form-full"><label>Issues / flags</label><textarea id="new-issues" style="min-height:60px;resize:vertical" placeholder="Any open issues or follow-up items…"></textarea></div>
      </div>
      <div style="display:flex;gap:8px;margin-top:4px">
        <button class="btn btn-primary" onclick="submitNewMember()">Add member</button>
        <button class="btn" onclick="showView('members')">Cancel</button>
      </div>
    </div>`;
}
function submitNewMember(){
  const fname=document.getElementById('new-fname').value.trim();
  const lname=document.getElementById('new-lname').value.trim();
  if(!fname&&!lname){toast('Please enter a name');return;}
  const name=[fname,lname].filter(Boolean).join(' ');
  const newMember={
    id: state.members.length>0?Math.max(...state.members.map(m=>m.id))+1:0,
    name,
    email:document.getElementById('new-email').value.trim(),
    phone:document.getElementById('new-phone').value.trim(),
    office:document.getElementById('new-office').value.trim(),
    role:document.getElementById('new-role').value,
    cohort:Number(document.getElementById('new-cohort').value),
    status:document.getElementById('new-status').value,
    trainingType:document.getElementById('new-training-type').value,
    trainingDate:document.getElementById('new-training-date').value,
    notes:document.getElementById('new-notes').value.trim(),
    issues:document.getElementById('new-issues').value.trim(),
    interactions:[]
  };
  state.members.push(newMember);
  saveState();
  if(isConnected())apiCall({action:'updateMember',...newMember});
  toast(name+' added');
  showView('members');
}

// ── Dashboard ──
function renderDashboard(){
  const el=document.getElementById('view-dashboard');
  const byStatus={};
  STATUSES.forEach(s=>byStatus[s]=0);
  state.members.forEach(m=>byStatus[m.status]=(byStatus[m.status]||0)+1);
  const total=state.members.length;
  const needAttention=state.members.filter(m=>m.status==='Needs follow-up'||m.issues);
  const recentLogs=state.members.flatMap(m=>(m.interactions||[]).map(i=>({...i,memberName:m.name,memberId:m.id}))).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,10);
  el.innerHTML=`
    <div class="page-header"><div>
      <div class="page-title">Dashboard</div>
      <div class="page-sub">Live overview of the Perchwell launch</div>
    </div></div>
    <div class="stat-grid" style="margin-bottom:1.5rem">
      <div class="stat-card"><div class="stat-label">Total members</div><div class="stat-value">${total}</div></div>
      <div class="stat-card"><div class="stat-label">Trained or live</div><div class="stat-value success">${state.members.filter(m=>['Training complete','Live'].includes(m.status)).length}</div></div>
      <div class="stat-card"><div class="stat-label">Open issues</div><div class="stat-value warn">${state.members.filter(m=>m.issues).length}</div></div>
      <div class="stat-card"><div class="stat-label">Interactions logged</div><div class="stat-value">${state.members.reduce((a,m)=>a+(m.interactions||[]).length,0)}</div></div>
    </div>
    <div class="dash-grid">
      <div class="dash-card">
        <div class="dash-card-title">Status breakdown</div>
        ${STATUSES.map(s=>{const cnt=byStatus[s]||0;const pct=Math.round(cnt/total*100);const col=STATUS_COLORS[s];return`<div class="bar-row"><div class="bar-label-row"><span>${s}</span><span style="color:var(--text-muted)">${cnt}</span></div><div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${col}"></div></div></div>`;}).join('')}
      </div>
      <div class="dash-card">
        <div class="dash-card-title">Members needing attention</div>
        ${needAttention.length===0?'<div class="empty-state" style="padding:1rem">All clear!</div>':needAttention.slice(0,8).map(m=>`<div class="attention-row" onclick="showView('members');setTimeout(()=>openMember(${m.id}),50)"><span>${m.name}</span><span class="badge" style="background:${m.status==='Needs follow-up'?'var(--danger-bg)':'var(--warning-bg)'};color:${m.status==='Needs follow-up'?'var(--danger)':'var(--warning)'}">${m.status==='Needs follow-up'?'follow-up':'has issue'}</span></div>`).join('')}
      </div>
      <div class="dash-card dash-full">
        <div class="dash-card-title">Recent interactions</div>
        ${recentLogs.length===0?'<div class="empty-state">No interactions logged yet.</div>':recentLogs.map(i=>`<div class="recent-row" onclick="showView('members');setTimeout(()=>openMember(${i.memberId}),50)"><span class="badge" style="background:${i.type==='Issue'?'var(--warning-bg)':i.type==='Feedback'?'var(--success-bg)':'var(--accent-bg)'};color:${i.type==='Issue'?'var(--warning)':i.type==='Feedback'?'var(--success)':'var(--accent)'};flex-shrink:0">${i.type}</span><div><span class="who">${i.memberName}</span> — <span class="what">${i.note.slice(0,90)}${i.note.length>90?'…':''}</span></div><span class="recent-date">${i.date}</span></div>`).join('')}
      </div>
    </div>`;
  updateConnectionStatus();
}

// ── Settings ──
function renderSettings(){
  document.getElementById('view-settings').innerHTML=`
    <div class="page-header"><div>
      <div class="page-title">Settings</div>
      <div class="page-sub">Connect to Google Sheets for shared access</div>
    </div></div>
    <div class="settings-card">
      <div class="settings-card-title">Current mode</div>
      <p style="font-size:14px;color:var(--text-muted);margin-bottom:1rem">${isConnected()?'✅ Connected to Google Sheets — all changes sync in real time.':'⚠️ Running in local-only mode — data is saved in this browser only.'}</p>
      ${isConnected()?'<button class="btn" onclick="disconnectAPI()">Disconnect Google Sheets</button>':''}
    </div>
    <div class="settings-card">
      <div class="settings-card-title">Connect to Google Sheets</div>
      <p style="font-size:14px;color:var(--text-muted);margin-bottom:1rem">Paste your deployed Apps Script Web App URL below to enable shared access.</p>
      <div class="field" style="margin-bottom:10px">
        <label>Apps Script Web App URL</label>
        <input type="text" id="api-url-input" placeholder="https://script.google.com/macros/s/…/exec" value="${APPS_SCRIPT_URL}">
      </div>
      <button class="btn btn-primary" onclick="saveAPIUrl()">Connect</button>
    </div>`;
  updateConnectionStatus();
}
function saveAPIUrl(){
  const url=document.getElementById('api-url-input').value.trim();
  APPS_SCRIPT_URL=url;
  localStorage.setItem('crm_api_url',url);
  updateConnectionStatus();
  toast(url?'Connected!':'Disconnected');
}
function disconnectAPI(){
  APPS_SCRIPT_URL='';
  localStorage.removeItem('crm_api_url');
  renderSettings();
  toast('Disconnected');
}

// ── Init ──
showView('members');

</script>
</body>
</html>
